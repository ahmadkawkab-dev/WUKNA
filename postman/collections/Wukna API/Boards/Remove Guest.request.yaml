$kind: http-request
name: 'Remove Guest'
method: DELETE
url: '{{base_url}}/api/boards/{{board_id}}/guests/{{guest_id}}'
order: 5000
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 or 404", () => {
          pm.expect(pm.response.code).to.be.oneOf([204, 404]);
      });
