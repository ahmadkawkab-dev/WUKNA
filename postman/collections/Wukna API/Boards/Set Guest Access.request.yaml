$kind: http-request
name: 'Set Guest Access'
method: PUT
url: '{{base_url}}/api/boards/{{board_id}}/guests'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{guest_email}}",
      "canEdit": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", () => pm.response.to.have.status(204));

      if (pm.response.code === 400) {
          const json = pm.response.json();
          pm.test("Error message present", () => pm.expect(json).to.have.property("error"));
      }
      if (pm.response.code === 409) {
          const json = pm.response.json();
          pm.test("Conflict error present", () => pm.expect(json).to.have.property("error"));
      }
