$kind: http-request
name: Logout
method: POST
url: '{{base_url}}/api/auth/logout'
order: 5000
headers:
  - key: X-CSRF-TOKEN
    value: '{{vault:csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204 No Content", () => pm.response.to.have.status(204));

      if (pm.response.code === 204) {
          await pm.vault.unset("access_token");
          console.log("Logged out — access token removed from Postman Local Vault.");
      }
