$kind: http-request
name: 'Refresh Token'
method: POST
url: '{{base_url}}/api/auth/refresh'
order: 4000
headers:
  - key: Accept
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{vault:csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));

      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.test("Response has accessToken", () => {
              pm.expect(json).to.have.property("accessToken");
              pm.expect(json.accessToken).to.be.a("string").and.not.empty;
          });
          await pm.vault.set("access_token", json.accessToken);
          console.log("Refreshed access token stored in Postman Local Vault.");
      }
