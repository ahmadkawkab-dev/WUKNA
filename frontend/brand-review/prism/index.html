<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Wukna · Prism fold preview</title><link rel="icon" href="/wukna.svg"></head><body><main><header class="preview-header"><a href="../index.html">wukna</a><span>Workspace motion preview</span></header><section class="preview-intro"><h1>Fold into your workspace.</h1><p>The W closes into a prism, completes a full 360° turn, then opens back into the W. A continuous loop for workspace opening.</p></section><section class="preview-stage" aria-label="Prism fold animation preview"><div class="preview-lockup"><svg id="prism-mark" viewBox="90 150 425 300" aria-hidden="true" focusable="false"></svg><span class="preview-wordmark">wukna</span><p>Opening your workspace…</p></div></section><section class="preview-controls" aria-label="Animation preview controls"><div class="preview-settings"><label>Appearance<select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Color theme<select id="palette"><option value="">Original moss</option></select></label><button id="play" aria-pressed="true">Pause</button><button id="replay">Replay</button></div><label class="preview-timeline">Explore the fold<input id="timeline" type="range" min="0" max="8000" step="1" value="0"><span id="phase">Open W</span></label><label class="preview-reduce"><input id="reduce" type="checkbox"> Reduced motion</label><p id="preview-note">Approved animation · 8-second loop · Used when opening the workspace.</p></section></main><script type="module" src="./main.mjs"></script></body></html>
