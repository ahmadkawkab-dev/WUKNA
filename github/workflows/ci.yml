name: CI

on:
 push:
 pull request:

permissions:
  content: read

jobs:
  backend:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{matrix.os}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet version: 10.0.x
      
      - name: Restore
        run: dotnet restore tests/Wukna.IntegrationTests/Wukna.IntegrationTests.csproj
        
      - name: Build
        run: dotnet build tests/Wukna.IntegrationTests/Wukna.IntegrationTests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Wukna.IntegrationTests/Wukna.IntegrationTests.csproj --configuration Release --no-build