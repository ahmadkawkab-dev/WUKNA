# Reused private services. Apply with the dev or production Library override.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-master.dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-filer", "-s3", "-s3.config=/run/secrets/library-s3.json", "-s3.iam=false", "-s3.autoCreateBucket=false", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.idleTimeout=60", "-master.volumeSizeLimitMB=1024", "-volume.max=0", "-s3.concurrentFileUploadLimit=4", "-s3.concurrentUploadLimitMB=80"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s
    volumes:
      - library_objects:/data
      - ${LIBRARY_S3_CONFIG_FILE:?Generate LIBRARY_S3_CONFIG_FILE}:/run/secrets/library-s3.json:ro
      - ./ops/library-filer.toml:/etc/seaweedfs/filer.toml:ro
    networks: [library_private]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:9333/cluster/status | grep -q '"IsLeader":true'
          && wget -q -O /dev/null http://127.0.0.1:8888/
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  clamd:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    volumes: [library_clam_signatures:/var/lib/clamav]
    networks: [library_private, library_scanner_egress]
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
