# Opt-in only; this file does not deploy or migrate the production application.
# Keep /etc/wukna/library-storage/storage.env root-owned (0600), like production.env.
services:
  api:
    environment:
      Library__Storage__Enabled: "true"
      Library__Storage__Endpoint: http://seaweedfs:8333
      Library__Storage__Bucket: wukna-library
      Library__Storage__AccessKey: ${LIBRARY_S3_ACCESS_KEY:?Generate Library credentials}
      Library__Storage__SecretKey: ${LIBRARY_S3_SECRET_KEY:?Generate Library credentials}
      Library__Storage__QuarantineDirectory: /app/App_Data/library-quarantine
      Library__Storage__ClamHost: clamd
    depends_on:
      seaweedfs: {condition: service_healthy}
      clamd: {condition: service_healthy}
    networks: [data, edge, library_private, scanner_private]
    volumes: [library_quarantine:/app/App_Data/library-quarantine]
  seaweedfs:
    extends: {file: compose.library.services.yaml, service: seaweedfs}
  clamd:
    # Reuse Chat's ARM64 scanner configuration and existing signatures volume.
    # Do not apply development scanner defaults to the production service.
    extends: {file: compose.attachments.production.yaml, service: clamd}
networks:
  library_private: {internal: true}
  scanner_private: {internal: true}
  scanner_egress: {}
volumes:
  library_objects: {}
  library_quarantine: {}
  clamav_signatures_prod: {}
